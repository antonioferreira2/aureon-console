name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and pip-audit
        run: python -m pip install -e . pip-audit
      - name: Audit installed dependency snapshot
        run: |
          python -m pip freeze | grep -vE '^-e |^aureon-console==' > /tmp/aureon-requirements-audit.txt
          pip-audit --strict --requirement /tmp/aureon-requirements-audit.txt

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Security invariants and repository hygiene
        run: python -m pytest -q tests/test_security.py tests/test_db.py
