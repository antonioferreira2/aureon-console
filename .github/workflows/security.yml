name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit
        run: pip-audit --strict || echo "review advisories above"

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Security invariants
        run: python -m pytest -q tests/test_security.py tests/test_db.py
      - name: No real data committed
        run: |
          if git grep -nE '([0-9]{1,3}\.){3}[0-9]{1,3}' -- ':!tests/*' ':!docs/*' ':!README.md' ; then
            echo "possible real IP address committed outside docs/tests"; exit 1
          fi
      - name: No database or logs committed
        run: |
          if git ls-files | grep -E '\.(db|log|sqlite)$'; then
            echo "database or log file committed"; exit 1
          fi
