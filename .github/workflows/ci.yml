name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  distro-validation:
    name: validate (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            prepare: apt-get update && apt-get install -y --no-install-recommends git python3 python3-venv python3-pip ca-certificates passwd util-linux
          - distro: fedora:43
            prepare: dnf install -y git python3 python3-pip shadow-utils util-linux
          - distro: almalinux:9
            prepare: dnf install -y git python3 python3-pip shadow-utils util-linux
    container: ${{ matrix.distro }}
    steps:
      # git must exist before actions/checkout runs inside the container.
      - name: Install system prerequisites
        run: ${{ matrix.prepare }}

      - uses: actions/checkout@v4

      - name: Create an unprivileged test account
        run: useradd --create-home --shell /bin/bash aureon-ci

      - name: Prepare an unprivileged source checkout
        run: |
          mkdir -p /tmp/aureon-ci-src
          cp -a "$GITHUB_WORKSPACE"/. /tmp/aureon-ci-src/
          chown -R aureon-ci:aureon-ci /tmp/aureon-ci-src

      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/aureon-ci-venv
          /tmp/aureon-ci-venv/bin/python -m pip install --upgrade pip
          /tmp/aureon-ci-venv/bin/python -m pip install -e "/tmp/aureon-ci-src[dev]"
          chown -R aureon-ci:aureon-ci /tmp/aureon-ci-src

      - name: Run the complete suite, including TUI tests, unprivileged
        run: su --login --shell /bin/bash aureon-ci -c 'cd /tmp/aureon-ci-src && /tmp/aureon-ci-venv/bin/python -m pytest -q'

      - name: Verify per-user install, repeat protection and data-preserving uninstall
        run: |
          su --login --shell /bin/bash aureon-ci -c 'cd /tmp/aureon-ci-src && ./install.sh'
          su --login --shell /bin/bash aureon-ci -c '"$HOME/.local/bin/aureon" --version && "$HOME/.local/bin/aureon" modules --json > /dev/null'
          if su --login --shell /bin/bash aureon-ci -c 'cd /tmp/aureon-ci-src && ./install.sh'; then
            echo "per-user installer was not idempotent"; exit 1
          fi
          su --login --shell /bin/bash aureon-ci -c '"$HOME/.local/bin/aureon" ingest'
          su --login --shell /bin/bash aureon-ci -c 'test -e "$HOME/.local/share/aureon/aureon.db"'
          su --login --shell /bin/bash aureon-ci -c 'cd /tmp/aureon-ci-src && ./install.sh --uninstall'
          su --login --shell /bin/bash aureon-ci -c 'test ! -e "$HOME/.local/share/aureon/venv" && test -e "$HOME/.local/share/aureon/aureon.db"'

      - name: Install AUREON system-wide
        run: ./install.sh

      - name: Installed binary works
        run: |
          /usr/local/bin/aureon --version
          /usr/local/bin/aureon modules --json > /dev/null

      - name: Second install must refuse
        run: |
          if ./install.sh; then
            echo "installer was not idempotent"; exit 1
          fi

      - name: Uninstall removes the app but keeps history
        run: |
          test -e /var/lib/aureon
          ./install.sh --uninstall
          test ! -e /usr/local/share/aureon/venv
          test -d /var/lib/aureon

  headless-smoke:
    name: headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: doctor
        run: aureon doctor
      - name: modules
        run: aureon modules --json
      - name: stats without data
        run: aureon stats --period today --json
      - name: f2b plan is read-only
        run: aureon f2b plan
      - name: no file was written to /etc/fail2ban
        run: test ! -e /etc/fail2ban/jail.d/aureon-sshd.local

  installer:
    name: installer (repeated run must be idempotent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: first install
        run: ./install.sh
      - name: installed binary works
        run: $HOME/.local/bin/aureon --version
      - name: second install must refuse
        run: |
          if ./install.sh; then
            echo "installer was not idempotent"; exit 1
          fi
      - name: uninstall removes the app but keeps history
        run: |
          "$HOME/.local/bin/aureon" ingest
          test -e "$HOME/.local/share/aureon/aureon.db"
          ./install.sh --uninstall
          test ! -e "$HOME/.local/share/aureon/venv"
          test -e "$HOME/.local/share/aureon/aureon.db"
